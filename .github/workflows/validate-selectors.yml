name: Validate selectors

# Automatic triggers paused at the owner's request on 2026-10-17.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python validation (heuristics)
        run: python scripts/update_selectors.py validate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install selector validator deps
        working-directory: scripts/ci
        run: npm ci --no-audit --no-fund

      - name: Chromium validation (insertRule)
        run: |
          node scripts/ci/validate.mjs \
            lists/static.txt \
            lists/generated/merged.txt

