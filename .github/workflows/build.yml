name: Build

# Automatic triggers paused at the owner's request on 2026-10-17.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release (select an existing version tag as the workflow ref)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Report skipped release signing
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        run: echo "::warning::RELEASE_KEYSTORE is not configured; release APK will be unsigned."

      - name: Detect prerelease
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF#refs/tags/v}
            ACTUAL_VERSION=$(sed -n 's/^version\.name=//p' gradle.properties | tr -d '\r')
            [[ "$VERSION_NAME" = "$ACTUAL_VERSION" ]] || { echo "Tag/version metadata mismatch"; exit 1; }
          else
            [[ "${{ inputs.publish }}" != "true" ]] || { echo "Publishing requires a version tag ref"; exit 1; }
            VERSION_NAME=$(sed -n 's/^version\.name=//p' gradle.properties | tr -d '\r')
          fi
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          if [[ "$VERSION_NAME" =~ (rc|alpha|beta) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APKs
        run: |
          ./gradlew ktlintCheck lintDebug assembleDebug assembleRelease || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || 'PKCS12' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amznkiller-v${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Generate release notes
        if: github.event_name == 'push' || inputs.publish
        id: changelog
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: ${{ steps.changelog.outputs.content || '' }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
