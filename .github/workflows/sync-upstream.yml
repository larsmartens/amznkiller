name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without pushing commits, tags or releases
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.ref != 'refs/heads/main' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/hxreborn/amznkiller.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          LAST_RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')
          if [ "$DRY_RUN" = "true" ] || [ "$BEHIND" != "0" ] || [ -z "$LAST_RELEASE" ] || ! git diff --quiet "$LAST_RELEASE" HEAD -- . ':!gradle.properties'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No changes since published release $LAST_RELEASE"
          fi
          echo "Upstream is $BEHIND commit(s) ahead"

      - name: Capture fork baseline
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main --no-edit -X ours || {
            git diff --name-only --diff-filter=U > conflicts.txt
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                .github/workflows/*)
                  git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
                gradle.properties)
                  git checkout --theirs -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
                *)
                  git checkout --ours -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
              esac
            done < conflicts.txt
            rm -f conflicts.txt
            git add -A
            git commit --no-edit
          }

      - name: Re-apply fork references
        if: steps.check.outputs.behind != '0'
        run: |
          sed -i 's|raw.githubusercontent.com/hxreborn/amznkiller|raw.githubusercontent.com/larsmartens/amznkiller|g' \
            app/src/main/kotlin/eu/hxreborn/amznkiller/prefs/Prefs.kt
          sed -i 's|https://github.com/hxreborn/amznkiller|https://github.com/larsmartens/amznkiller|g' \
            README.md app/src/main/kotlin/eu/hxreborn/amznkiller/ui/screen/settings/SettingsScreen.kt .github/ISSUE_TEMPLATE/config.yml

          if ! git diff --quiet; then
            git add README.md app/src/main/kotlin/eu/hxreborn/amznkiller/prefs/Prefs.kt app/src/main/kotlin/eu/hxreborn/amznkiller/ui/screen/settings/SettingsScreen.kt .github/ISSUE_TEMPLATE/config.yml
            git commit -m "chore: re-apply fork references after upstream sync"
          fi

      - name: Restore fork workflows
        if: steps.check.outputs.behind != '0'
        run: |
          git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree .github/workflows || true
          if ! git diff --cached --quiet -- .github/workflows; then
            git add .github/workflows
            git commit -m "chore: preserve fork workflows after upstream sync"
          fi

      - name: Prepare fork release metadata
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          source .github/release.sh --source-only
          RAW_VERSION=$(grep '^version\.name=' gradle.properties | head -n 1 | cut -d= -f2- | tr -d '\r')
          BASE_VERSION=${RAW_VERSION%%-fork.*}
          BASE_BUILD=$(git rev-list --count HEAD)
          RUN_NUMBER=${GITHUB_RUN_NUMBER:-0}
          RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-1}
          BUILD_NUMBER=$(next_fork_build_number "$BASE_VERSION" "$((BASE_BUILD + RUN_NUMBER * 10 + RUN_ATTEMPT))")
          VERSION_NAME="${BASE_VERSION}-fork.${BUILD_NUMBER}"
          MAJOR=${BASE_VERSION%%.*}
          REST=${BASE_VERSION#*.}
          MINOR=${REST%%.*}
          VERSION_CODE=$((MAJOR * 100000 + MINOR * 10000 + BUILD_NUMBER))
          TAG_NAME="v${VERSION_NAME}"
          sed -i "s/^version\.code=.*/version.code=${VERSION_CODE}/; s/^version\.name=.*/version.name=${VERSION_NAME}/" gradle.properties
          git add gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare fork release metadata"
          fi
          printf 'version_name=%s\n' "${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          printf 'tag_name=%s\n' "${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Java for release build
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode keystore
        if: steps.check.outputs.should_release == 'true' && env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Report skipped release signing
        if: steps.check.outputs.should_release == 'true' && env.HAS_RELEASE_KEYSTORE != 'true'
        run: echo "::warning::RELEASE_KEYSTORE is not configured; release APK will be unsigned."

      - name: Detect prerelease
        if: steps.check.outputs.should_release == 'true'
        id: prerelease
        run: |
          VERSION_NAME=${{ steps.version.outputs.version_name }}
          if [[ "$VERSION_NAME" =~ (rc|alpha|beta) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        if: steps.check.outputs.should_release == 'true'
        run: ./gradlew ktlintCheck lintDebug assembleDebug assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || 'PKCS12' }}

      - name: Upload sync artifacts
        if: steps.check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: amznkiller-${{ steps.version.outputs.version_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish validated commit and release tag
        if: steps.check.outputs.should_release == 'true' && env.DRY_RUN != 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push --atomic origin HEAD:main "refs/tags/$TAG_NAME"

      - name: Generate release notes
        if: steps.check.outputs.should_release == 'true' && env.DRY_RUN != 'true'
        id: changelog
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true' && env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          body: ${{ steps.changelog.outputs.content || '' }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
