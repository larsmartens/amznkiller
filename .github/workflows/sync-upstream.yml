name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_XPOSED_REPO_PAT: ${{ secrets.XPOSED_REPO_PAT != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/hxreborn/amznkiller.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commit(s) ahead"

      - name: Capture fork baseline
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main --no-edit -X ours || {
            git diff --name-only --diff-filter=U > conflicts.txt
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                .github/workflows/*)
                  git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
                gradle.properties)
                  git checkout --theirs -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
                *)
                  git checkout --ours -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
              esac
            done < conflicts.txt
            rm -f conflicts.txt
            git add -A
            git commit --no-edit
          }

      - name: Re-apply fork references
        if: steps.check.outputs.behind != '0'
        run: |
          sed -i 's|raw.githubusercontent.com/hxreborn/amznkiller|raw.githubusercontent.com/larsmartens/amznkiller|g' \
            app/src/main/kotlin/eu/hxreborn/amznkiller/prefs/Prefs.kt
          sed -i 's|https://github.com/hxreborn/amznkiller|https://github.com/larsmartens/amznkiller|g' \
            README.md app/src/main/kotlin/eu/hxreborn/amznkiller/ui/screen/settings/SettingsScreen.kt .github/ISSUE_TEMPLATE/config.yml

          if ! git diff --quiet; then
            git add README.md app/src/main/kotlin/eu/hxreborn/amznkiller/prefs/Prefs.kt app/src/main/kotlin/eu/hxreborn/amznkiller/ui/screen/settings/SettingsScreen.kt .github/ISSUE_TEMPLATE/config.yml
            git commit -m "chore: re-apply fork references after upstream sync"
          fi

      - name: Restore fork workflows
        if: steps.check.outputs.behind != '0'
        run: |
          git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree .github/workflows || true
          if ! git diff --quiet -- .github/workflows; then
            git add .github/workflows
            git commit -m "chore: preserve fork workflows after upstream sync"
          fi

      - name: Bump fork release metadata
        if: steps.check.outputs.behind != '0'
        id: version
        run: |
          source .github/release.sh --source-only
          RAW_VERSION=$(grep '^version\.name=' gradle.properties | head -n 1 | cut -d= -f2- | tr -d '\r')
          BASE_VERSION=${RAW_VERSION%%-fork.*}
          BUILD_COUNT=$(git rev-list --count HEAD)
          VERSION_NAME="${BASE_VERSION}-fork.${BUILD_COUNT}"
          VERSION_CODE=$(compute_version_code "$BASE_VERSION")
          TAG_NAME="v${VERSION_NAME}"
          TMP_PROPS=$(mktemp)
          grep -v '^version\.\(code\|name\)=' gradle.properties > "${TMP_PROPS}"
          printf '\nversion.code=%s\nversion.name=%s\n' "${VERSION_CODE}" "${VERSION_NAME}" >> "${TMP_PROPS}"
          mv "${TMP_PROPS}" gradle.properties
          git add gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare fork release metadata"
          fi
          printf 'version_name=%s\n' "${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          printf 'tag_name=%s\n' "${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Push synced branch
        if: steps.check.outputs.behind != '0'
        run: git push origin main

      - name: Create and push release tag
        if: steps.check.outputs.behind != '0'
        run: |
          git tag -a "${{ steps.version.outputs.tag_name }}" -m "${{ steps.version.outputs.tag_name }}"
          git push origin "${{ steps.version.outputs.tag_name }}"

      - name: Setup Java for release build
        if: steps.check.outputs.behind != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode keystore
        if: steps.check.outputs.behind != '0' && env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Report skipped release signing
        if: steps.check.outputs.behind != '0' && env.HAS_RELEASE_KEYSTORE != 'true'
        run: echo "::warning::RELEASE_KEYSTORE is not configured; release APK will be unsigned."

      - name: Detect prerelease
        if: steps.check.outputs.behind != '0'
        id: prerelease
        run: |
          VERSION_NAME=${{ steps.version.outputs.version_name }}
          if [[ "$VERSION_NAME" =~ (rc|alpha|beta) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        if: steps.check.outputs.behind != '0'
        run: ./gradlew assembleDebug assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload sync artifacts
        if: steps.check.outputs.behind != '0'
        uses: actions/upload-artifact@v4
        with:
          name: amznkiller-${{ steps.version.outputs.version_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Generate release notes
        if: steps.check.outputs.behind != '0'
        id: changelog
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        if: steps.check.outputs.behind != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          body: ${{ steps.changelog.outputs.content || '' }}
          files: app/build/outputs/apk/release/*.apk

      - name: Mirror release to Xposed-Modules-Repo
        if: steps.check.outputs.behind != '0' && env.HAS_XPOSED_REPO_PAT == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/eu.hxreborn.amznkiller
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          body: ${{ steps.changelog.outputs.content || '' }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Report skipped Xposed mirror
        if: steps.check.outputs.behind != '0' && env.HAS_XPOSED_REPO_PAT != 'true'
        run: echo "::warning::XPOSED_REPO_PAT is not configured; fork release was created, but Xposed-Modules-Repo was not updated."
